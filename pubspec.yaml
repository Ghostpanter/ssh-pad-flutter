name: ssh_pad_flutter
description: "Pad-first Flutter SSH/Telnet/SFTP/FTP terminal (ServerBox-aligned rewrite of ssh-pad)"
publish_to: 'none'
version: 0.5.9+14

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dartssh2: ^4.1.0
  xterm: ^4.0.0
  flutter_riverpod: ^2.6.1
  file_picker: ^10.1.2
  ftpconnect: ^2.0.7
  shared_preferences: ^2.5.3
  wakelock_plus: ^1.2.10
  ctelnet: ^0.3.1
  path_provider: ^2.1.6
  flutter_secure_storage: ^10.3.4
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
